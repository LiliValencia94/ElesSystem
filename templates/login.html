<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ElesSystem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_inicio.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <p class="subtitulo">Inicio de sesión</p>
            <input type="text" class="servidor" value="Servidor_192.168.1.12\SQLEXPRESS" readonly />

            <h1 class="titulo">ElesSystem</h1>

            <!-- 🔹 Agregamos el action correctamente -->
            <form method="POST" action="{{ url_for('login') }}">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" name="clave" required />
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>

                {% if error %}
                <p style="color: red; font-size: 12px;">{{ error }}</p>
                {% endif %}

                <div class="botones">
                    <button type="submit" class="btn aceptar">Aceptar</button>
                    <button type="reset" class="btn cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script_inicio.js') }}"></script>
</body>
</html>
